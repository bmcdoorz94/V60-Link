# Rebuilds the live site whenever source files change on main, so edited files in src/ or tools/
# (for example uploaded through GitHub's website after a Gemini session) deploy without running anything locally.
name: Build site
on:
  push:
    branches: [main]
    paths: ["src/**", "tools/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: build, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Syntax check every script
        run: for f in src/js/*.js src/js/data/*.js src/js/modules/*.js; do node --check "$f" || exit 1; done
      - name: Build
        run: python3 tools/build.py
      - name: Commit build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html version.json app.css js sw.js manifest.webmanifest link.html dist-artifact
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Build site from source [automated]"
          # another push can land while this build runs; rebase onto it (keeping this build's output) and try again
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main && git rebase -X theirs origin/main || { git rebase --abort; python3 tools/build.py; git add -A index.html version.json app.css js sw.js manifest.webmanifest link.html dist-artifact; git commit --amend --no-edit; }
          done
          git push
