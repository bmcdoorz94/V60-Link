# Builds the V60 iPhone app's .ipa on GitHub's Mac (free for this public repo) and publishes it for SideStore:
# each build becomes a release ios-<version>.<build>, and the source SideStore reads is the asset source.json on
# the release "sidestore" (ios/sidestore_source.py). Sideloadly can still install the artifact V60-test.
# Bump MARKETING_VERSION / CURRENT_PROJECT_VERSION in ios/project.yml for SideStore to offer an update.
name: Build iPhone app

permissions:
  contents: write

on:
  workflow_dispatch:
  # TestFlight builds stop working after 90 days; a monthly build keeps a fresh one on the phone.
  schedule:
    - cron: "17 9 1 * *"
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  test-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen

      # The app icon is the web app's icon, enlarged to the 1024 px iOS wants.
      - name: Icon
        run: sips -z 1024 1024 ../icons/icon-512.png --out V60App/Assets.xcassets/AppIcon.appiconset/icon.png

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project V60.xcodeproj -scheme V60 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -80; tail -40 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -40 || true

      # Ad-hoc signed; Sideloadly re-signs it with Kyle's Apple ID.
      - name: Package the test .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/V60.app
          codesign --force --sign - "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry ../V60-test.ipa Payload)
          ls -la V60-test.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: V60-test
          path: ios/V60-test.ipa
          retention-days: 14

      - name: Publish for SideStore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLIST=build/Build/Products/Release-iphoneos/V60.app/Info.plist
          V=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          B=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")
          TAG="ios-$V.$B"
          cp V60-test.ipa "V60-$V.ipa"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "V60 iPhone app $V" \
            --notes "V60 iPhone app $V (build $B), from commit ${GITHUB_SHA::7}."
          gh release upload "$TAG" "V60-$V.ipa" --clobber
          python3 sidestore_source.py > source.json
          python3 -c "import json; s=json.load(open('source.json')); print('source lists', [v['version'] + '.' + v['buildVersion'] for v in s['apps'][0]['versions']])"
          gh release view sidestore >/dev/null 2>&1 || gh release create sidestore --prerelease --title "SideStore source" \
            --notes "In SideStore: Sources, +, then https://github.com/$GITHUB_REPOSITORY/releases/download/sidestore/source.json"
          gh release upload sidestore source.json --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ios/build.log
          retention-days: 7

  # TestFlight: an App Store-signed build, uploaded with Kyle's App Store Connect API key (secrets ASC_KEY_ID,
  # ASC_ISSUER_ID, ASC_KEY_P8; one-time steps in ios/TESTFLIGHT.md). Signing is Apple's cloud signing
  # (-allowProvisioningUpdates with the key), so no certificate file is kept anywhere. Skipped until the secrets exist.
  # Apple accepts uploads built with Xcode 26 or later only (since April 2026), so the newest Xcode on the runner is used.
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Is TestFlight set up?
        id: ready
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "TestFlight is not set up yet (ios/TESTFLIGHT.md); nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Newest Xcode
        if: steps.ready.outputs.ok == 'true'
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          MAJOR=$(basename "$X" | sed -E 's/Xcode_([0-9]+).*/\1/')
          echo "Using $X"
          [ "$MAJOR" -ge 26 ] || { echo "Apple needs Xcode 26 or later and this runner's newest is $X."; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version
          brew install xcodegen

      - name: Check App Store Connect
        if: steps.ready.outputs.ok == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/asc/bin/python" asc.py | tee "$RUNNER_TEMP/asc.txt"
          grep '^TEAM=' "$RUNNER_TEMP/asc.txt" >> "$GITHUB_ENV"
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"; chmod 600 "$KEY"
          echo "KEYPATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive, sign and upload
        if: steps.ready.outputs.ok == 'true'
        run: |
          sips -z 1024 1024 ../icons/icon-512.png --out V60App/Assets.xcassets/AppIcon.appiconset/icon.png
          xcodegen generate
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEYPATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          show() { grep -E "error:|Error|failed" "$1" | sort -u | head -60; tail -30 "$1"; }
          archive() { rm -rf build/V60.xcarchive; xcodebuild archive -project V60.xcodeproj -scheme V60 -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/V60.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=$BUILD "$@" > archive.log 2>&1 || { show archive.log; exit 1; }; }
          export_ipa() { rm -rf build/export; xcodebuild -exportArchive -archivePath build/V60.xcarchive -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist "${AUTH[@]}" > export.log 2>&1; }
          # First try: an unsigned archive, signed once at export by Apple's cloud distribution certificate.
          # If that is refused, archive with automatic signing (this may add an "Apple Development" certificate).
          archive CODE_SIGNING_ALLOWED=NO
          if ! export_ipa; then
            echo "Export of the unsigned archive failed; archiving with automatic signing."; show export.log
            archive "${AUTH[@]}"
            export_ipa || { show export.log; exit 1; }
          fi
          ls -la build/export
          xcrun altool --upload-app -f build/export/V60.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          V=$(grep -E 'MARKETING_VERSION' project.yml | sed -E 's/.*"(.*)".*/\1/')
          echo "### Sent to TestFlight: V60 $V (build $BUILD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Apple processes it for 5-30 minutes; then TestFlight installs it on the phone if automatic updates are on." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && steps.ready.outputs.ok == 'true'
        with:
          name: testflight-logs
          path: |
            ios/archive.log
            ios/export.log
          retention-days: 7
          if-no-files-found: ignore
