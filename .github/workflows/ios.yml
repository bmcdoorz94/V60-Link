# Builds the V60 iPhone app's .ipa on GitHub's Mac (free for this public repo) and publishes it for SideStore:
# each build becomes a release ios-<version>.<build>, and the source SideStore reads is the asset source.json on
# the release "sidestore" (ios/sidestore_source.py). Sideloadly can still install the artifact V60-test.
# Bump MARKETING_VERSION / CURRENT_PROJECT_VERSION in ios/project.yml for SideStore to offer an update.
name: Build iPhone app

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  test-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen

      # The app icon is the web app's icon, enlarged to the 1024 px iOS wants.
      - name: Icon
        run: sips -z 1024 1024 ../icons/icon-512.png --out V60App/Assets.xcassets/AppIcon.appiconset/icon.png

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project V60.xcodeproj -scheme V60 -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -80; tail -40 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -40 || true

      # Ad-hoc signed; Sideloadly re-signs it with Kyle's Apple ID.
      - name: Package the test .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/V60.app
          codesign --force --sign - "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry ../V60-test.ipa Payload)
          ls -la V60-test.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: V60-test
          path: ios/V60-test.ipa
          retention-days: 14

      - name: Publish for SideStore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLIST=build/Build/Products/Release-iphoneos/V60.app/Info.plist
          V=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          B=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")
          TAG="ios-$V.$B"
          cp V60-test.ipa "V60-$V.ipa"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "V60 iPhone app $V" \
            --notes "V60 iPhone app $V (build $B), from commit ${GITHUB_SHA::7}."
          gh release upload "$TAG" "V60-$V.ipa" --clobber
          python3 sidestore_source.py > source.json
          python3 -c "import json; s=json.load(open('source.json')); print('source lists', [v['version'] + '.' + v['buildVersion'] for v in s['apps'][0]['versions']])"
          gh release view sidestore >/dev/null 2>&1 || gh release create sidestore --prerelease --title "SideStore source" \
            --notes "In SideStore: Sources, +, then https://github.com/$GITHUB_REPOSITORY/releases/download/sidestore/source.json"
          gh release upload sidestore source.json --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ios/build.log
          retention-days: 7
